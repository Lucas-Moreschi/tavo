name: tavo
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tavo
      POSTGRES_USER: tavo
      POSTGRES_PASSWORD: tavo_local_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - tavo_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavo -d tavo"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      target: build
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://tavo:tavo_local_dev@db:5432/tavo
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://tavo:tavo_local_dev@db:5432/tavo
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Configure BETTER_AUTH_SECRET no arquivo .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  tavo_postgres:
